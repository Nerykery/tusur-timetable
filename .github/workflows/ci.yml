name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка, тесты и линт
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK 35
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Unit-тесты
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Линт и detekt
        run: ./gradlew :app:lintDebug detekt --no-daemon

      - name: Debug и Release APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            build/reports/detekt/
            app/build/outputs/apk/debug/*.apk
          retention-days: 7
